# Builds every pull request and every push to main, and deploys main.
#
# The build job's name is the required check in the branch ruleset, so renaming
# it silently drops the gate.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A pull request's run is superseded by its next push; a run on main is never
  # cancelled, so a deploy is never cut off halfway.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
        env:
          PUBLIC_POSTHOG_KEY: ${{ vars.POSTHOG_PROJECT_KEY_SITES }}
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          retention-days: 7

  deploy:
    name: Deploy to withmarfa.com
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deploy at a time, in order, across runs.
    concurrency:
      group: deploy-withmarfa-com
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Deploys exactly what the build job checked.
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # A green run means the site serves this build, not only that the upload
      # succeeded: the page must carry this build's script.
      - name: Check the live site
        run: |
          script="$(grep -o '/_astro/[^"]*\.js' dist/index.html | head -1)"
          for attempt in 1 2 3 4 5 6; do
            if curl -fsS https://withmarfa.com/ | grep -qF "Introducing Marfa" \
              && { [ -z "$script" ] || curl -fsS https://withmarfa.com/ | grep -qF "$script"; }; then
              echo "withmarfa.com serves this build"; exit 0
            fi
            sleep 10
          done
          echo "::error::withmarfa.com does not serve this build"; exit 1
